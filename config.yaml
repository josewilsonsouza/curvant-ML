# CurvantML
huggingface:
  dataset_id: jwsouza13/routes_ML_inmetro

# Dataset do pipeline: nome base ou caminho em data/ (com ou sem _clean/.parquet).
# null = auto-detecta o primeiro disponível, preferindo o _clean. A flag --data sobrescreve.
data:
  dataset: eletro_rjdf_serra_rjmgba_janeiro_agda_denso

physics:
  mu: 0.6          # coeficiente de atrito lateral (asfalto seco ~0.6; molhado ~0.4)
  isl_baixo: 0.5   # ISL < 0.5  -> classe 'baixo'
  isl_alto: 0.8    # ISL >= 0.8 -> classe 'alto'  (entre 0.5 e 0.8 -> 'medio')

# ===================== Pipeline de dados =====================

# Limpeza dos dados brutos.  Subcomando: cvt preprocess
preprocessing:
  accel_limite: 5.0              # m/s^2 - clip de spikes do acelerômetro
  vel_max: 200.0                 # km/h - velocidade máxima plausível
  vel_min_parado: 1.0            # km/h - abaixo disso o carro é considerado parado
  max_parados_consecutivos: 3    # pontos parados consecutivos mantidos
  max_gap: 120.0                  # s - gap temporal que divide um trajeto em sub-trajetos
  min_pontos_segmento: 10        # pontos mínimos por sub-trajeto

# Detecção de curvas: B-spline -> curvatura -> raio -> classe DNIT.
curve_detection:
  sigma: 2           # suavização gaussiana sobre a curvatura
  sigma_gps: 0.0     # 0 = spline interpoladora (padrão). >0 = suavizadora (splprep, s=n·σ²).
                     # Mantido em 0: a suavizadora foi testada e reprovada por reescrever
                     # ~20% dos rótulos de curva.
  limite_raio: 150   # m - raio máximo para marcar curva=True
  raio_min: 20.0     # m - clip do raio para ctp_accel. Era 5.0, o que
                     # deixava passar geometria impossível: 12.6% dos pontos em curva tinham
                     # raio abaixo de 5 m (ruído de GPS) e 9.2% davam aceleração centrípeta
                     # acima do limite de aderência. Alinhado agora com raio_min_isl.
  raio_min_isl: 20.0 # m - piso do raio SÓ para o rótulo de ISL (isl_class), isolado do ctp_accel
                     # acima. Um raio de B-spline abaixo disto é ruído de GPS (nenhuma estrada
                     # tomada em velocidade tem raio de poucos metros) e v²/R explodiria: com 5 m
                     # o isl chegava a 22 (impossível). 20 m afeta ~28% dos pontos (quase todos
                     # ruído) e mantém o ISL plausível, sem tocar nos critérios de risco.

  # Classificação DNIT (Manual de Projeto Geométrico de Rodovias Rurais, 2010); D = 1145.92/R
  dnit:
    muito_fechada: 50    # R <= 50 m
    fechada:      100    # R <= 100 m
    media:        200    # R <= 200 m
    aberta:       500    # R <= 500 m
    # suave: R > 500 m

# Correção tardia: o motorista freou forte depois de já estar dentro da curva. É o único
# critério de comportamento que sobrou; o porquê das remoções está em docs/CORRECAO_TARDIA.md.
correcao_tardia:
  limiar_desaceleracao: 2.0    # m/s² - frenagem dentro da curva que caracteriza a correção.
                               # Marca ~24% das curvas; frear ANTES da curva não conta.
  margem_histerese: 0.10       # faixa morta de +-10% ao redor do limiar: valor dentro dela marca
                               # a curva como indefinida (rótulo decidido pelo ruído da medida,
                               # já que a velocidade do OBD é quantizada em passos de 1 km/h) e
                               # ela sai do treino. 0 desliga.


# ===================== Modelos =====================

# Parâmetros compartilhados pelos modelos tabulares (cvt tab velocity|isl|correcao).
# Também usado pelas análises complementares de train_correcao (fora da CLI).
ml:
  random_state: 42
  test_size: 0.3
  cv_folds: 5
  pca_n_components: null       # null = sem PCA | int = nº de componentes | float 0–1 = variância mantida

# Ajuste de hiperparâmetros (XGBoost + RandomForest + LogReg).
# Usado pela análise complementar train_correcao.otimizado (fora da CLI).
optuna:
  n_trials_xgb: 50
  n_trials_rf: 30
  n_trials_lr: 20
  timeout: 300        # s máximos por otimização

# Modelos sobre a série temporal bruta pré-curva (cvt seq velocity|isl|correcao).

temporais:
  model: [lstm, gru]                #opções: gru | lstm | cnn1d | mlp | linear | rf | xgboost
  task: auto                   # auto (detecta pelo target) | regression | classification

  # O ALVO não fica aqui: vem do subcomando (`cvt seq velocity|isl|correcao`). Assim não dá para
  # esquecer de trocar o YAML e rodar o alvo errado sem perceber.

  # Multitarefa (só com o alvo `velocity`): além da velocidade, uma cabeça de classe prevê
  # isl_class direto, em vez de derivar a faixa cortando a velocidade por limiar. A velocidade
  # segue como alvo principal (a parada antecipada olha o MSE dela). peso_classe (lambda) pesa a
  # perda da classe na soma L = MSE(v) + lambda·CE(classe); baixo mantém a velocidade dominante.
  multitarefa: true            # false = só velocidade (comportamento antigo)
  peso_classe: 0.3             # lambda da cabeça de classe

  target_cap_percentil: 99     # remove extremos acima deste percentil do target (null = sem filtro)
  n_timesteps: 100              # comprimento fixo após reamostragem da janela
  epochs: 100
  batch_size: 32
  lr: 0.005
  dropout: 0.3
  early_stopping_patience: 150 # épocas sem melhora na val_loss -> parar
  val_size: 0.30               # fração do treino usada para validação
  weight_decay: 0.01           # L2 no Adam
  hidden_size: 64              # GRU / LSTM
  n_layers: 2                  # GRU / LSTM
  channels: [32, 64]           # CNN1D
  kernel_size: 3               # CNN1D
