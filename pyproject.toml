[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvant-ml"
version = "1.0.0.1"
description = "ML framework for predicting risky driving behavior on road curves using vehicular sensor data"
requires-python = ">=3.10"

dependencies = [
    "huggingface-hub",
    "scipy",
    "matplotlib",
    "plotly",
    "seaborn",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "imbalanced-learn",
    "pyyaml",
    "pyarrow",
    "optuna>=3.0",
    # heavy ML backends moved to optional-dependencies (see below)
]

