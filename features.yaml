# Extração das features da janela de aproximação, mais a whitelist que decide o que cada
# representação enxerga. Criou uma feature nova em curvant/driving/features.py? Ela só entra
# no modelo depois de listada aqui.

extracao:
  precurva_distancia: null       # m fixos antes da curva; null = usa a distância de frenagem confortável
  precurva_desacel_confort: 2.5  # m/s² - desaceleração de conforto da janela dinâmica
  precurva_distancia_min: 20     # m - tamanho mínimo da janela
  precurva_distancia_max: 400    # m - tamanho máximo da janela
  lead_gap: 30                   # m - folga antes da entrada, o que torna a predição antecipada
  vars_sensor:                   # sensores que viram estatísticas na janela
    - vehicle_speed

flags:

  # Representação TABULAR (`cvt tab <alvo>`): as features já resumidas por curva. Os três
  # alvos compartilham a lista, porque a aproximação é a mesma; o que muda é só o que se prevê.
  #
  # A lista é curta de propósito. Tudo que vinha do acelerômetro saiu, porque o sensor é do
  # celular usado na coleta e mede vibração. Das features restantes ficou um representante de
  # cada grupo correlacionado, escolhido por desempenho nos alvos. O histórico está em
  # docs/ANALISE_DADOS.md.
  tab:
    features:
      # velocidade na aproximação
      - vehicle_speed_min
      - vehicle_speed_cv
      - vehicle_speed_slope
      - vehicle_speed_slope_tarde
      # oscilação de direção na aproximação
      - precurva_n_mudancas_dir
      - precurva_bearing_range
      # o quanto o trecho antes da curva já era sinuoso
      - precurva_raio_min
      - precurva_raio_mean
      - precurva_raio_last
      # geometria da curva que vem pela frente
      - curva_raio_min
      - curva_raio_mean
      # o que o motorista já enfrentou nesta rota
      - n_curvas_antes
      - prev_isl_max
      - mean_isl_antes
      - prev_raio_min

  # Importância de features analisa o modelo tabular, então usa a mesma lista.
  importance:
    herda: tab

  # Representação de SEQUÊNCIA (`cvt seq <alvo>`). São duas entradas diferentes, por isso não
  # viram uma lista só: `sensors` são canais que variam no tempo, `scalares_extras` são números
  # fixos da curva, repetidos em todos os instantes. Deixar `scalares_extras` vazio é válido.
  seq:
    sensors:
      - vehicle_speed
      - engine_rpm
    scalares_extras:
      - precurva_raio_min
      - precurva_raio_mean
      - precurva_raio_last
      - curva_raio_min
      - curva_raio_mean
      - mean_isl_antes
      - prev_isl_max
      - n_curvas_antes
