[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvant"
version = "1.0.0"
description = "Predicting risky driving behavior on road curves using vehicular sensor data"
requires-python = ">=3.10"

dependencies = [
    "scipy",
    "matplotlib",
    "seaborn",
    "pandas",
    "scikit-learn",
    "xgboost",
    "imbalanced-learn",
    "pyyaml",
    "pyarrow",
    "optuna>=3.0",
]

[project.scripts]
cvt = "curvant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["curvant"]
