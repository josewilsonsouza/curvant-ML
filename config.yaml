# CurvantML
huggingface:
  dataset_id: jwsouza13/routes_ML_inmetro

physics:
  mu: 0.6          # coeficiente de atrito lateral (asfalto seco ~0.6; molhado ~0.4)
  isl_baixo: 0.5   # ISL < 0.5  -> classe 'baixo'
  isl_alto: 0.8    # ISL >= 0.8 -> classe 'alto'  (entre 0.5 e 0.8 -> 'medio')

# ===================== Pipeline de dados =====================

# Limpeza dos dados brutos.  Subcomando: cvt preprocess
preprocessing:
  accel_limite: 5.0              # m/s^2 - clip de spikes do acelerômetro
  vel_max: 200.0                 # km/h - velocidade máxima plausível
  vel_min_parado: 1.0            # km/h - abaixo disso o carro é considerado parado
  max_parados_consecutivos: 3    # pontos parados consecutivos mantidos
  max_gap: 120.0                  # s - gap temporal que divide um trajeto em sub-trajetos
  min_pontos_segmento: 10        # pontos mínimos por sub-trajeto

# Detecção de curvas: B-spline -> curvatura -> raio -> classe DNIT.
curve_detection:
  sigma: 2           # suavização gaussiana sobre a curvatura
  sigma_gps: 0.0     # 0 = spline interpoladora (padrão). >0 = suavizadora (splprep, s=n·σ²).
                     # Mantido em 0: a suavizadora foi testada e reprovada por reescrever
                     # ~20% dos rótulos de curva.
  limite_raio: 150   # m - raio máximo para marcar curva=True
  raio_min: 5.0      # m - clip do raio para ctp_accel (usado no risco/zigue-zague); mantido
                     # baixo para não mexer no alvo de risco.
  raio_min_isl: 20.0 # m - piso do raio SÓ para o rótulo de ISL (isl_class), isolado do ctp_accel
                     # acima. Um raio de B-spline abaixo disto é ruído de GPS (nenhuma estrada
                     # tomada em velocidade tem raio de poucos metros) e v²/R explodiria: com 5 m
                     # o isl chegava a 22 (impossível). 20 m afeta ~28% dos pontos (quase todos
                     # ruído) e mantém o ISL plausível, sem tocar nos critérios de risco.

  # Classificação DNIT (Manual de Projeto Geométrico de Rodovias Rurais, 2010); D = 1145.92/R
  dnit:
    muito_fechada: 50    # R <= 50 m
    fechada:      100    # R <= 100 m
    media:        200    # R <= 200 m
    aberta:       500    # R <= 500 m
    # suave: R > 500 m

risk_measures:
  kamm_alpha: 0.7              # alpha para o critério de Kamm
                               # 0.7 -> limiar = 0.7 × 0.6 × 9.81 ~ 4.12 m/s²
  limiar_accel_lateral: 2.0    # m/s² - |accel_y|_max mínimo p/ o critério lateral (DNIT >= média)
  zigue_zague:
    limiar_bearing: 15         # graus - mudança mínima de direção
    limiar_ctp: 0.3            # m/s² - aceleração centrípeta mínima (ctp_accel = v²/R)
    min_mudancas: 3            # nº de alternâncias para caracterizar zigue-zague

# Produz mc_p_baixo / mc_p_medio / mc_p_alto (probabilidade de cada classe de ISL).
montecarlo:
  n_sim: 1000
  k_ultimos: 20      # últimos pontos da janela usados p/ a tendência de velocidade
  sigma_min: 5       # desvio mínimo em km/h (incerteza do sensor)


# ===================== Modelos =====================

# Parâmetros compartilhados pelos modelos tabulares (cvt tab risk|isl|velocity).
# Também usado pela análise em notebooks/analise_risco.ipynb.
ml:
  random_state: 42
  test_size: 0.3
  cv_folds: 5
  pca_n_components: 20       # null = sem PCA | int = nº de componentes | float 0–1 = variância mantida

# Ajuste de hiperparâmetros (XGBoost + RandomForest + LogReg).
# Usado pela análise complementar em notebooks/analise_risco.ipynb (etapa_ml_otimizado).
optuna:
  n_trials_xgb: 50
  n_trials_rf: 30
  n_trials_lr: 20
  timeout: 300        # s máximos por otimização

# Modelos sobre a série temporal bruta pré-curva (cvt seq risk|isl|velocity).

temporais:
  model: [lstm]                #opções: gru | lstm | cnn1d | mlp | linear | rf | xgboost
  task: auto                   # auto (detecta pelo target) | regression | classification

  # O ALVO não fica aqui: vem do subcomando (`cvt seq risk|isl|velocity`). Assim não dá para
  # esquecer de trocar o YAML e rodar o alvo errado sem perceber.

  # Multitarefa (só com o alvo `velocity`): além da velocidade, uma cabeça de classe prevê
  # isl_class direto, em vez de derivar a faixa cortando a velocidade por limiar. A velocidade
  # segue como alvo principal (a parada antecipada olha o MSE dela). peso_classe (λ) pesa a
  # perda da classe na soma L = MSE(v) + λ·CE(classe); baixo mantém a velocidade dominante.
  multitarefa: true            # false = só velocidade (comportamento antigo)
  peso_classe: 0.3             # λ da cabeça de classe

  target_cap_percentil: 99     # remove extremos acima deste percentil do target (null = sem filtro)
  n_timesteps: 50              # comprimento fixo após reamostragem da janela
  epochs: 400
  batch_size: 32
  lr: 0.005
  dropout: 0.3
  early_stopping_patience: 100 # épocas sem melhora na val_loss -> parar
  val_size: 0.30               # fração do treino usada para validação
  weight_decay: 0.01           # L2 no Adam
  hidden_size: 64              # GRU / LSTM
  n_layers: 1                  # GRU / LSTM
  channels: [32, 64]           # CNN1D
  kernel_size: 3               # CNN1D
